name: Defender Compliance Gate

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  defender:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write   # for SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - name: Install Defender
        run: uv pip install --system -e .

      - name: Run Defender on the PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            | defender review --stdin --format sarif -o defender.sarif
        # exits non-zero if the gate FAILs, blocking the merge

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: defender.sarif
