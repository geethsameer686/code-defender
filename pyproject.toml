[project]
name = "defender"
version = "0.1.0"
description = "Defender — AI Code Compliance Defender for regulated banking systems. Multi-agent, shift-left, BYOM code validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Defender Team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# BYOM providers — install only what your deployment needs.
# 'adk' is the flagship path: genuine Google ADK LlmAgent/ParallelAgent/Runner.
adk = ["google-adk>=1.0.0", "google-genai>=1.0.0"]
gemini = ["google-adk>=1.0.0", "google-genai>=1.0.0"]
openai = ["openai>=1.30"]
ollama = ["httpx>=0.27"]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23"]

[project.scripts]
defender = "defender.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["defender"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
